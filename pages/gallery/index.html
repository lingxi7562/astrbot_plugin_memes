<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>表情包库</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-left">
        <span class="logo">🖼️</span>
        <h1 class="title">表情包库</h1>
      </div>
      <div class="toolbar-center">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16">
            <path
              fill="currentColor"
              d="M9.5 3A6.5 6.5 0 0 1 16 9.5a6.5 6.5 0 0 1-1.19 3.76l4.46 4.47-1.06 1.06-4.47-4.46A6.5 6.5 0 0 1 9.5 16 6.5 6.5 0 0 1 3 9.5 6.5 6.5 0 0 1 9.5 3m0 1.5A5 5 0 0 0 4.5 9.5a5 5 0 0 0 5 5 5 5 0 0 0 5-5A5 5 0 0 0 9.5 4.5z"
            />
          </svg>
          <input
            id="filter-input"
            class="search-input"
            type="text"
            placeholder="搜索标签或文件名..."
            autocomplete="off"
          />
        </div>
      </div>
      <div class="toolbar-right">
        <span id="stats" class="stats"></span>
        <button id="settings-btn" class="btn-settings" title="插件设置">
          <svg viewBox="0 0 24 24" width="15" height="15">
            <path
              fill="currentColor"
              d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"
            />
          </svg>
          <span>设置</span>
        </button>
        <button id="refresh-btn" class="btn-refresh">
          <svg viewBox="0 0 24 24" width="15" height="15">
            <path
              fill="currentColor"
              d="M12 5V1L7 6l5 5V7a6 6 0 0 1 6 6 6 6 0 0 1-6 6 6 6 0 0 1-6-6H4a8 8 0 0 0 8 8 8 8 0 0 0 8-8 8 8 0 0 0-8-8z"
            />
          </svg>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>加载中...</p>
    </div>

    <main id="gallery" class="gallery"></main>

    <div id="load-sentinel" class="load-sentinel" style="display: none">
      <div class="spinner"></div>
      <span>加载中...</span>
    </div>

    <div id="empty" class="empty" style="display: none">
      <div class="empty-icon">📭</div>
      <p class="empty-text">表情包库为空</p>
      <p class="empty-hint">请检查索引文件配置</p>
    </div>

    <div id="settings-overlay" class="settings-overlay" style="display: none"></div>
    <aside id="settings-panel" class="settings-panel">
      <div class="settings-header">
        <h2>插件设置</h2>
        <button id="settings-close" class="settings-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path
              fill="currentColor"
              d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
            />
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <div class="setting-group">
          <label class="setting-label" for="setting-match-mode">匹配模式</label>
          <select id="setting-match-mode" class="setting-select">
            <option value="keyword">关键词匹配</option>
            <option value="embedding">向量语义匹配</option>
            <option value="hybrid">混合匹配（关键词+向量）</option>
          </select>
        </div>

        <div class="setting-group" id="embedding-settings">
          <label class="setting-label" for="setting-emb-provider">Embedding Provider</label>
          <select id="setting-emb-provider" class="setting-select">
            <option value="">自动选择</option>
          </select>
          <p class="setting-hint" id="embedder-status"></p>
        </div>

        <div class="setting-group">
          <label class="setting-label" for="setting-fallback">向量失败回退关键词</label>
          <div class="setting-toggle-wrap">
            <input type="checkbox" id="setting-fallback" class="setting-toggle" />
            <label for="setting-fallback" class="setting-toggle-label"></label>
          </div>
        </div>

        <div class="setting-group">
          <label class="setting-label" for="setting-max-candidates">候选数量上限</label>
          <input type="number" id="setting-max-candidates" class="setting-input" min="1" max="100" />
        </div>

        <div class="setting-group">
          <label class="setting-label" for="setting-min-score">最低匹配分数</label>
          <input type="number" id="setting-min-score" class="setting-input" min="0" max="100" step="0.5" />
        </div>

        <div class="setting-group">
          <label class="setting-label" for="setting-thumb-size">缩略图尺寸(px)</label>
          <input type="number" id="setting-thumb-size" class="setting-input" min="50" max="400" />
        </div>

        <div class="setting-group">
          <label class="setting-label" for="setting-auto-refresh">启动时自动加载</label>
          <div class="setting-toggle-wrap">
            <input type="checkbox" id="setting-auto-refresh" class="setting-toggle" />
            <label for="setting-auto-refresh" class="setting-toggle-label"></label>
          </div>
        </div>

        <hr class="setting-divider" />

        <div class="setting-group">
          <label class="setting-label" for="setting-inject-enabled">提示词注入</label>
          <div class="setting-toggle-wrap">
            <input type="checkbox" id="setting-inject-enabled" class="setting-toggle" />
            <label for="setting-inject-enabled" class="setting-toggle-label"></label>
          </div>
          <p class="setting-hint">开启后每次 LLM 请求时注入提示词，提醒 LLM 使用 send_meme 工具</p>
        </div>

        <div class="setting-group" id="inject-prompt-group">
          <label class="setting-label" for="setting-inject-prompt">注入提示词</label>
          <textarea
            id="setting-inject-prompt"
            class="setting-textarea"
            rows="8"
            placeholder="在此输入要注入的提示词。可使用 {tag_list} 占位符，运行时替换为当前库中部分可用标签。"
          ></textarea>
          <p class="setting-hint">{tag_list} 会在运行时替换为当前库中前 80 个标签</p>
        </div>
      </div>
      <div class="settings-footer">
        <p class="settings-tip">修改后需重载插件才能生效</p>
        <button id="settings-save" class="btn-save">保存设置</button>
      </div>
    </aside>

    <div id="lightbox" class="lightbox" style="display: none">
      <div class="lightbox-backdrop"></div>
      <img id="lightbox-img" class="lightbox-img" />
      <button id="lightbox-close" class="lightbox-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path
            fill="currentColor"
            d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
          />
        </svg>
      </button>
      <div id="lightbox-info" class="lightbox-info"></div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
